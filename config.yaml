# Simulation Parameters
simulation:
  num_pufs: 10
  stages_per_arbiter: 64
  num_arbiters: 4
  num_challenges: 100
  num_readings_reliability: 50
  noise_levels: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5] # Using explicit list for YAML
  random_seed: 42 # For reproducibility

# Output Settings
output:
  figures_dir: "figures"
  results_dir: "results"
  save_figures: true
  save_metrics: true

# Attack Simulation Settings
attack:
  enabled: true
  type: "LogisticRegression"
  num_train_crps: 1000
  num_test_crps: 500